<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F8; font-family: 'DM Sans', sans-serif; color: #15171C; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{accent}}">Step 1 of 1</div>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Your usual week</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5A6170">Add what repeats. Tasks get scheduled around it.</p>
  </div>

  <div style="margin: 0 16px 14px; background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 100%; height: 120px; background: #F3F5F8; border-radius: 8px; position: relative; overflow: hidden">
            <sc-for list="{{c.blocks}}" as="b" hint-placeholder-count="2">
              <div style="position: absolute; left: 3px; right: 3px; top: {{b.top}}; height: {{b.h}}; background: {{b.bg}}; border-radius: 4px"></div>
            </sc-for>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: #5A6170">{{c.d}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; font-size: 12px; color: #5A6170">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #15171C"></span>Work</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #8A93A3"></span>Gym &amp; meals</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F3F5F8; border: 1px solid #C9D0DA"></span>Free for tasks</span>
    </div>
  </div>

  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column">
    <sc-for list="{{routines}}" as="r" hint-placeholder-count="4">
      <button style="min-height: 60px; padding: 10px 14px; border: 0; border-bottom: 1px solid #EEF1F5; background: transparent; display: flex; align-items: center; justify-content: space-between; text-align: left; font-family: 'DM Sans', sans-serif; color: #15171C">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">{{r.name}}</span>
          <span style="font-size: 13px; color: #5A6170">{{r.when}}</span>
        </div>
        <span style="font-size: 13px; font-weight: 500; color: #5A6170">{{r.days}}</span>
      </button>
    </sc-for>
    <button style="min-height: 52px; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; color: {{accent}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add something that repeats
    </button>
  </div>

  <div style="margin: 14px 16px 0; background: #FFFFFF; border-radius: 16px; padding: 4px 14px">
    <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EEF1F5; font-size: 15px">
      <span>Schedule tasks between</span><span style="font-weight: 600">8 AM – 9 PM</span>
    </div>
    <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
      <span>Gap between tasks</span><span style="font-weight: 600">15 min</span>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 16px 34px">
    <a href="Main.dc.html" style="height: 54px; border-radius: 16px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Save my week</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#7C3AED","#D9480F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2F5BEA';
    const px = 7.5;
    const blk = (start, end, bg) => ({ top: ((start - 7) * px) + 'px', h: ((end - start) * px) + 'px', bg });
    const work = blk(9, 17, '#15171C');
    const lunch = blk(12, 13, '#8A93A3');
    const gym = blk(18, 19, '#8A93A3');
    const cols = [
      { d: 'M', blocks: [work, gym] },
      { d: 'T', blocks: [work] },
      { d: 'W', blocks: [work, gym] },
      { d: 'T', blocks: [work] },
      { d: 'F', blocks: [work, gym] },
      { d: 'S', blocks: [] },
      { d: 'S', blocks: [blk(9, 10, '#8A93A3'), lunch] }
    ];
    const routines = [
      { name: 'Work', when: '9:00 AM – 5:00 PM', days: 'Mon–Fri' },
      { name: 'Gym', when: '6:00 – 7:00 PM', days: 'M · W · F' },
      { name: 'Sunday gym + lunch', when: '9–10 AM, 12–1 PM', days: 'Sun' },
      { name: 'Sleep', when: '11:00 PM – 7:00 AM', days: 'Every day' }
    ];
    return { accent, cols, routines };
  }
}
</script>
</body>
</html>
