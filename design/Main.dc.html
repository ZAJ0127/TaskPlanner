<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F8; font-family: 'DM Sans', sans-serif; color: #15171C; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="padding: 56px 20px 12px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; font-weight: 500; color: #5A6170">Sunday, Oct 18</div>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Today</h1>
    </div>
    <div style="display: flex; background: #E3E7ED; border-radius: 10px; padding: 3px">
      <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: #15171C">Day</button>
      <a href="Week.dc.html" style="height: 32px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; color: #5A6170; text-decoration: none">Week</a>
    </div>
  </div>

  <div style="padding: 0 14px 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button style="height: 56px; border: 0; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'DM Sans', sans-serif">
        <span style="font-size: 12px; font-weight: 500">{{d.w}}</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">{{d.n}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 0 16px 14px; background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #5A6170">Anytime today · 2</h2>
      <span style="font-size: 12px; color: #5A6170">No set time</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 15px">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #2F5BEA">
      Pay electric bill
    </label>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 15px">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #2F5BEA">
      <span style="text-decoration: line-through; color: #7A8190">Reply to landlord</span>
    </label>
  </div>

  <div style="flex: 1; display: flex; padding: 0 16px; gap: 8px; min-height: 0">
    <div style="width: 40px; position: relative; flex-shrink: 0">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
        <div style="position: absolute; left: 0; top: {{h.top}}; font-size: 11px; font-weight: 500; color: #7A8190; transform: translateY(-7px)">{{h.label}}</div>
      </sc-for>
    </div>
    <div style="flex: 1; position: relative; border-top: 1px solid #DDE2E9">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
        <div style="position: absolute; left: 0; right: 0; top: {{h.top}}; border-top: 1px solid #DDE2E9"></div>
      </sc-for>

      <div style="position: absolute; left: 0; right: 0; top: 2px; height: 56px; background: #E3E7ED; border-radius: 12px; padding: 8px 12px; box-sizing: border-box; display: flex; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Gym</span>
          <span style="font-size: 12px; color: #5A6170">9:00 – 10:00 · Weekly schedule</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Repeats weekly"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
      </div>

      <div style="position: absolute; left: 0; right: 0; top: 92px; height: 43px; background: {{accent}}; color: #FFFFFF; border-radius: 12px; padding: 0 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 15px; font-weight: 600">Groceries</span>
          <span style="font-size: 12px; opacity: 0.9">10:30 – 11:15</span>
        </div>
        <span style="font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.22); padding: 3px 8px; border-radius: 99px">Auto-placed</span>
      </div>

      <div style="position: absolute; left: -6px; right: 0; top: 70px; display: flex; align-items: center">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #D9480F"></div>
        <div style="flex: 1; height: 2px; background: #D9480F"></div>
      </div>

      <div style="position: absolute; left: 0; right: 0; top: 182px; height: 56px; background: #E3E7ED; border-radius: 12px; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Lunch</span>
        <span style="font-size: 12px; color: #5A6170">12:00 – 1:00 · Weekly schedule</span>
      </div>

      <div style="position: absolute; left: 0; right: 0; top: 272px; height: 56px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 12px; padding: 6px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Clean apartment</span>
        <span style="font-size: 12px; color: #5A6170">1:30 – 2:30 · You picked this time</span>
      </div>

      <button style="position: absolute; left: 0; right: 0; top: 362px; height: 56px; background: transparent; border: 1.5px dashed #B4BCC8; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: #5A6170">
        Free · 1 hr — tap to fill
      </button>
    </div>
  </div>

  <a href="AddTask.dc.html" aria-label="Add task" style="position: absolute; right: 20px; bottom: 104px; width: 60px; height: 60px; border-radius: 20px; background: #15171C; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(21,23,28,0.25)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </a>

  <nav style="height: 84px; background: #FFFFFF; border-top: 1px solid #E3E7ED; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 20px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Today
    </a>
    <a href="Week.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #7A8190; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      Week
    </a>
    <a href="Chores.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #7A8190; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
      Chores
    </a>
    <a href="Insights.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #7A8190; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Time
    </a>
    <a href="Schedule.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #7A8190; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg>
      Routine
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#7C3AED","#D9480F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2F5BEA';
    const w = ['S','M','T','W','T','F','S'];
    const days = w.map((x, i) => ({ w: x, n: String(18 + i), bg: i === 0 ? accent : '#FFFFFF', fg: i === 0 ? '#FFFFFF' : '#15171C' }));
    const labels = ['9 AM','10','11','12 PM','1','2','3','4'];
    const hours = labels.map((l, i) => ({ label: l, top: (i * 60) + 'px' }));
    return { accent, days, hours };
  }
}
</script>
</body>
</html>
